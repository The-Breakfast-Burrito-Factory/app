<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Breakfast Burrito Factory App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function redirect() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var iosLink = "https://apple.com";
            var androidLink = "https://google.com";
            var fallbackLink = "https://thebreakfastburritofactory.com"; 

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(iosLink);
                setTimeout(function() { window.location.href = iosLink; }, 250);
            } else if (/android/i.test(userAgent)) {
                window.location.replace(androidLink);
                setTimeout(function() { window.location.href = androidLink; }, 250);
            } else {
                window.location.replace(fallbackLink);
            }
        }
        window.onload = redirect;
    </script>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fafafa; }
        .container { text-align: center; padding: 30px; }
        .spinner { border: 4px solid rgba(0,0,0,0.08); width: 40px; height: 40px; border-radius: 50%; border-left-color: #e65100; animation: spin 0.8s linear infinite; margin: 0 auto 24px auto; }
        .btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background-color: #e65100; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p style="font-size: 16px; margin-bottom: 5px; font-weight: 500;">Opening App Store...</p>
        <p style="font-size: 14px; color: #666; margin-top: 0;">If you are not redirected automatically, tap below.</p>
        <a href="https://apple.com" class="btn" id="manual-btn" onclick="redirect()">Open Store</a>
    </div>
    <script>
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var btn = document.getElementById('manual-btn');
        if (/android/i.test(ua)) { btn.href = "https://google.com"; }
        else if (!(/iPad|iPhone|iPod/.test(ua) && !window.MSStream)) { btn.href = "https://thebreakfastburritofactory.com"; }
    </script>
</body>
</html>
