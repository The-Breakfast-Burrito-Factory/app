<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Breakfast Burrito Factory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function redirect() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // Standard App Store Destinations
            var iosStore = "https://apps.apple.com/us/app/the-breakfast-burrito-factory/id6759361628";
            var androidStore = "https://google.com";
            var webFallback = "https://thebreakfastburritofactory.com"; 

            // Deep link scheme to try waking up the app directly if it's installed
            var iosDeepLink = "thebreakfastburritofactory://"; 
            var androidDeepLink = "intent://#Intent;scheme=thebreakfastburritofactory;package=com.storefrontconsumer.the.breakfast.burrito.factory;end";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // Try opening the app locally first
                window.location.href = iosDeepLink;
                // If the app isn't installed, fallback to the store page after a tiny delay
                setTimeout(function() {
                    window.location.replace(iosStore);
                }, 1500);
            } 
            else if (/android/i.test(userAgent)) {
                // Android intent handles app launching and store redirect gracefully
                window.location.href = androidDeepLink;
                setTimeout(function() {
                    window.location.replace(androidStore);
                }, 1500);
            } 
            else {
                window.location.replace(webFallback);
            }
        }
        window.onload = redirect;
    </script>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fafafa; text-align: center; }
        .spinner { border: 4px solid rgba(0,0,0,0.08); width: 40px; height: 40px; border-radius: 50%; border-left-color: #e65100; animation: spin 0.8s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p>Opening The Breakfast Burrito Factory...</p>
    </div>
</body>
</html>
